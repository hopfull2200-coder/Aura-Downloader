name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git python3-dev python3-pip \
            build-essential libssl-dev libffi-dev \
            libsqlite3-dev zlib1g-dev libbz2-dev \
            libreadline-dev libncurses5-dev \
            libgdbm-dev liblzma-dev tk-dev \
            openjdk-17-jdk unzip wget curl autoconf libtool

    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade cython buildozer

    - name: Initialize Buildozer Spec
      run: |
        # Agar buildozer.spec pehle se nahi hai toh init karein
        if [ ! -f buildozer.spec ]; then
            buildozer init
        fi
        
        # Spec file mein app ki details aur dependencies set karna
        sed -i 's/# title = My Application/title = Aura Downloader/g' buildozer.spec
        sed -i 's/# package.name = myapp/package.name = auradownloader/g' buildozer.spec
        sed -i 's/# package.domain = org.test/package.domain = com.aura/g' buildozer.spec
        sed -i 's/# requirements = python3,kivy/requirements = python3,kivy,flask,yt-dlp,openssl,urllib3,certifi,idna,charset-normalizer,requests/g' buildozer.spec
        sed -i 's/# orientation = portrait/orientation = portrait/g' buildozer.spec

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: aura-apk
        path: bin/*.apk
