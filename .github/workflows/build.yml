name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Build with Buildozer
      uses: kivy/buildozer-action@master
      id: buildozer
      with:
        filename: buildozer.spec
        command: |
          buildozer init
          sed -i 's/# title = My Application/title = Aura Downloader/g' buildozer.spec
          sed -i 's/# package.name = myapp/package.name = auradownloader/g' buildozer.spec
          sed -i 's/# package.domain = org.test/package.domain = com.aura/g' buildozer.spec
          sed -i 's/# requirements = python3,kivy/requirements = python3,kivy,flask,yt-dlp,openssl,urllib3,certifi,idna,charset-normalizer,requests/g' buildozer.spec
          buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
